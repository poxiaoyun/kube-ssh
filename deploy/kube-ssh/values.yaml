global:
  imageRegistry: ""
  imageRepository: ""
  imagePullSecrets: []
  storageClass:
  security:
    allowInsecureImages: true
  clusterDomain: cluster.local

kubeSsh:
  image:
    registry: registry.cn-hangzhou.aliyuncs.com
    repository: xiaoshiai/kube-ssh
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets: []

  replicaCount: 1
  revisionHistoryLimit: 10

  # Optional class used to select Access objects. Empty handles only classless Access objects.
  gatewayClassName: ""

  # Optional publicly reachable gateway addresses published to matching Access status.
  # Each entry must use host:port form; IPv6 addresses must be bracketed. When
  # empty, a NodePort Service publishes {NodeIP}:<nodePort> automatically.
  # Example: ["ssh.example.com:2222"]
  advertiseAddresses: []

  containerPorts:
    ssh: 22
    metrics: 8080

  metrics:
    enabled: true

  service:
    type: NodePort
    annotations: {}
    ports:
      ssh: 22
    nodePorts:
      ssh: 30022
    externalTrafficPolicy: Cluster
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  rbac:
    create: true

  hostKey:
    existingSecret: ""
    secretKey: ssh_host_key
    # Generate and persist an Ed25519 key when no operator-managed key is configured.
    autoGenerate: true
    # Optional inline private key for operator-managed deployments.
    # existingSecret takes precedence; leave both empty to generate and persist an Ed25519 key.
    privateKey: ""
    mountPath: /etc/kube-ssh/host-key

  managed:
    # apiserver uses pods/exec and pods/portforward.
    # cri sends data through the node-local CRI data plane.
    transport: apiserver
    cri:
      port: 10443
      serverName: ""

  node:
    # Checked in order. Leave empty to probe common containerd, CRI-O, K3s,
    # K0s, and cri-dockerd sockets below the mounted host /run directory.
    runtimeEndpoints: []
    extraArgs: []
    managementPort: 18080
    expectedClientName: kube-ssh-gateway
    tls:
      # Leave empty to let Helm generate and preserve a release-scoped CA and
      # certificate. An existing Secret must contain ca.crt, tls.crt, tls.key.
      existingSecret: ""
    podAnnotations: {}
    podLabels: {}
    resources:
      limits: {}
      requests: {}
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - operator: Exists
    affinity: {}

  # Advanced gateway options use CLI flags; omitted flags keep program defaults.
  # Example: ["--authentication-method=publickey", "--policy-default-idle-timeout=15m"]
  extraArgs: []
  extraEnvVars: []
  extraEnvVarsCM: ""
  extraEnvVarsSecret: ""
  extraVolumes: []
  extraVolumeMounts: []
  initContainers: []
  sidecars: []

  podAnnotations: {}
  podLabels: {}
  deploymentAnnotations: {}
  commonLabels: {}
  commonAnnotations: {}

  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      add:
        - NET_BIND_SERVICE
      drop:
        - ALL

  resources:
    limits: {}
    requests: {}

  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  startupProbe: {}

  affinity: {}
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
  schedulerName: ""
